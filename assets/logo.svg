<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="speedGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hexagon Tile -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="url(#glowGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Speed Dial Outer Arc -->
  <path d="M 120 370 A 170 170 0 1 1 392 370" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round"/>
  <!-- Active Speed Gauge Arc -->
  <path d="M 120 370 A 170 170 0 1 1 360 200" fill="none" stroke="url(#speedGrad)" stroke-width="24" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Ticks -->
  <line x1="145" y1="335" x2="165" y2="320" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="180" y1="230" x2="202" y2="238" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="165" x2="256" y2="190" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <line x1="332" y1="230" x2="310" y2="238" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <line x1="367" y1="335" x2="347" y2="320" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>

  <!-- Lightning Needle -->
  <polygon points="256,120 274,270 256,290 238,270" fill="url(#speedGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="280" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="8"/>
  <circle cx="256" cy="280" r="14" fill="#38bdf8"/>

  <!-- 1M Mark text -->
  <text x="256" y="425" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="4">BENCH</text>
</svg>
